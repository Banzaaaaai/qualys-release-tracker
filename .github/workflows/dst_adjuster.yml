name: DST Schedule Adjuster — Qualys Tracker

# Fires on the last Sunday of March (CEST, clocks forward) and the last
# Sunday of October (CET, clocks back) to repatch tracker.yml's two daily
# cron lines so they keep firing at 08:45 and 16:00 Amsterdam local time.
# Also runnable manually with force_offset for testing.

on:
  schedule:
    # Run every Sunday in the adjustment windows (Mar 24–31 and Oct 24–31)
    - cron: "50 1 24-31 3  0"   # last week of March,   Sundays at 01:50 UTC
    - cron: "50 1 24-31 10 0"   # last week of October, Sundays at 01:50 UTC
  workflow_dispatch:
    inputs:
      force_offset:
        description: "Force UTC offset (1 = CET winter, 2 = CEST summer). Leave blank for auto."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}   # PAT required to push workflow file changes
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compute correct UTC offset and patch cron
        env:
          FORCE_OFFSET: ${{ github.event.inputs.force_offset }}
        run: |
          python - <<'EOF'
          import os, re, calendar
          from datetime import date, timezone, timedelta

          def last_sunday(year: int, month: int) -> date:
              """Return the last Sunday of the given month."""
              last_day = date(year, month, calendar.monthrange(year, month)[1])
              offset   = last_day.weekday() + 1   # days since last Sunday (Mon=0 … Sun=6)
              if offset == 7:
                  offset = 0
              return last_day - timedelta(days=offset)

          force = os.getenv("FORCE_OFFSET", "").strip()
          if force in ("1", "2"):
              utc_offset = int(force)
              reason = f"forced (force_offset={force})"
          else:
              today = date.today()
              y     = today.year
              # After last Sunday of March and before (or on) last Sunday of October → CEST (UTC+2)
              summer_start = last_sunday(y, 3)
              summer_end   = last_sunday(y, 10)
              utc_offset   = 2 if summer_start <= today < summer_end else 1
              reason = f"auto (today={today}, summer={summer_start}→{summer_end})"

          print(f"UTC offset={utc_offset} ({reason})")

          wf_path = ".github/workflows/tracker.yml"
          text    = open(wf_path).read()

          # (comment marker in tracker.yml, local Amsterdam hour, local minute)
          SCHEDULES = [
              ("Morning run",   8, 45),
              ("Afternoon run", 16, 0),
          ]

          total_n = 0
          for label, local_hour, local_minute in SCHEDULES:
              utc_hour = (local_hour - utc_offset) % 24
              pattern  = rf'(# {re.escape(label)}.*?cron:\s*")[^"]+(")'
              text, n  = re.subn(
                  pattern, rf'\g<1>{local_minute} {utc_hour} * * *\2', text, flags=re.DOTALL
              )
              total_n += n
              status = "patched" if n else "NOT FOUND"
              print(f"{label} → {local_hour:02d}:{local_minute:02d} Amsterdam "
                    f"= {utc_hour:02d}:{local_minute:02d} UTC ({status})")

          if total_n == 0:
              print("WARNING: Could not locate any daily-tracker cron line — no changes made.")
          else:
              with open(wf_path, "w") as f:
                  f.write(text)
              print(f"Patched {wf_path} ({total_n} line(s) updated)")
          EOF

      - name: Commit cron change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tracker.yml
          git diff --cached --quiet && echo "No cron change needed — already correct." && exit 0
          OFFSET=$(python -c "
          import calendar; from datetime import date, timedelta
          def ls(y,m):
              ld=date(y,m,calendar.monthrange(y,m)[1]); off=ld.weekday()+1
              return ld-timedelta(days=0 if off==7 else off)
          d=date.today(); y=d.year
          print(2 if ls(y,3)<=d<ls(y,10) else 1)
          ")
          LABEL=$([ "$OFFSET" = "2" ] && echo "CEST UTC+2" || echo "CET UTC+1")
          git commit -m "chore: adjust cron to $LABEL (08:45 & 16:00 Amsterdam)"
          git push
